<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoM Studio — visual construction &amp; analysis of Bills of Materials</title>
    <meta name="description" content="Construct and analyse a Bill of Materials as a mixed graph — a directed Part hierarchy with undirected issue/action/report satellites — laid out with the HySE algorithm." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.6 21 7.3v9.4L12 21.4 3 16.7V7.3z' fill='none' stroke='%233b82f6' stroke-width='1.8'/%3E%3Cpath d='M3 7.3 12 12l9-4.7M12 12v9.4' fill='none' stroke='%233b82f6' stroke-width='1.8'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header id="toolbar" class="toolbar"></header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="Palette, filters and legend"></aside>
      <main id="cy" class="canvas" aria-label="Graph canvas"></main>
      <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
    </div>

    <footer id="status" class="status"></footer>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Hidden file input backing the "Open…" button. -->
    <input id="file-input" type="file" accept="application/json,.json" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
